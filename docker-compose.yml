version: "3.9"

services:
  web-dashboard:
    build: ./apps/web-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    environment:
      VITE_API_BASE_URL: http://localhost:8000

  api-gateway:
    build: ./apps/api-gateway
    ports:
      - "8000:8000"
    environment:
      ML_INFERENCE_URL: http://ml-inference:8500
      ML_RETRAIN_SCHEDULER_URL: http://ml-retrain-scheduler:8700
      SIMULATION_ENGINE_URL: http://simulation-engine:8600
      GRAPH_SERVICE_URL: http://graph-service:8900
      AUDIT_SERVICE_URL: http://audit-service:8800
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      - postgres
      - ml-inference
      - ml-retrain-scheduler
      - simulation-engine
      - graph-service
      - audit-service

  ml-inference:
    build: ./apps/ml-inference
    ports:
      - "8500:8500"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
      MODEL_VERSION: xgb_trained_external_v1
      CHALLENGER_VERSION: xgb_challenger_v3
    depends_on:
      - postgres

  simulation-engine:
    build: ./apps/simulation-engine
    ports:
      - "8600:8600"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      - postgres

  ml-retrain-scheduler:
    build: ./apps/ml-retrain-scheduler
    ports:
      - "8700:8700"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
      RUN_INTERVAL_SECONDS: "604800"
    depends_on:
      - postgres

  audit-service:
    build: ./apps/audit-service
    ports:
      - "8800:8800"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      - postgres

  graph-service:
    build: ./apps/graph-service
    ports:
      - "8900:8900"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      - postgres

  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_KRAFT_CLUSTER_ID=ci000000000000000000

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/test
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neodata:/data

  model-registry:
    image: minio/minio:RELEASE.2023-12-23T07-19-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  nginx:
    image: nginx:1.25
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web-dashboard
      - api-gateway

volumes:
  pgdata:
  neodata:
  miniodata:
