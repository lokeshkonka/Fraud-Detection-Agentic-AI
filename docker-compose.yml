services:
  web-dashboard:
    build: ./apps/web-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    environment:
      VITE_API_BASE_URL: http://localhost:8000

  api-gateway:
    build: ./apps/api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ML_INFERENCE_URL: http://ml-inference:8500
      ML_RETRAIN_SCHEDULER_URL: http://ml-retrain-scheduler:8700
      SIMULATION_ENGINE_URL: http://simulation-engine:8600
      GRAPH_SERVICE_URL: http://graph-service:8900
      AUDIT_SERVICE_URL: http://audit-service:8800
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      postgres:
        condition: service_healthy
      ml-inference:
        condition: service_started
      ml-retrain-scheduler:
        condition: service_started
      simulation-engine:
        condition: service_started
      graph-service:
        condition: service_started
      audit-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ml-inference:
    build: ./apps/ml-inference
    restart: unless-stopped
    ports:
      - "8500:8500"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
      MODEL_VERSION: xgb_trained_external_v1
      CHALLENGER_VERSION: xgb_challenger_v3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  simulation-engine:
    build: ./apps/simulation-engine
    restart: unless-stopped
    ports:
      - "8600:8600"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8600/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ml-retrain-scheduler:
    build: ./apps/ml-retrain-scheduler
    restart: unless-stopped
    ports:
      - "8700:8700"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
      RUN_INTERVAL_SECONDS: "604800"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  audit-service:
    build: ./apps/audit-service
    restart: unless-stopped
    ports:
      - "8800:8800"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  graph-service:
    build: ./apps/graph-service
    restart: unless-stopped
    ports:
      - "8900:8900"
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: apache/kafka:3.9.2
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - CLUSTER_ID=5L6g3nShT-eMCtK--X86sw

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/test1234
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neodata:/data

  model-registry:
    image: minio/minio:RELEASE.2023-12-23T07-19-11Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  nginx:
    image: nginx:1.25
    restart: unless-stopped
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web-dashboard
      - api-gateway

volumes:
  pgdata:
  neodata:
  miniodata:
